name: SURVEYOR | Verificar e publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveyor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verificar (tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (reprodutivel, a partir do package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos
        run: npm run typecheck

      - name: Validar funcoes oficiais (sintaxe)
        run: npm run test:functions

      - name: Testes e compilacao de producao
        run: npm run check:release

      - name: Preparar acesso direto as rotas React
        run: |
          cp dist/index.html dist/404.html
          test -f dist/CNAME
          test -f dist/.nojekyll

      - name: Enviar arquivos do site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
